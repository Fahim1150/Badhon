name: BADHON CD

on:
  workflow_run:
    workflows:
      - BADHON CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy BADHON
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'development') }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Show deployment configuration
        run: |
          echo "BADHON CD is configured for the production environment."
          echo "Deployment target: ${{ secrets.DEPLOY_HOST != '' && 'configured' || 'not configured' }}"
          echo "Deployment user: ${{ secrets.DEPLOY_USER != '' && 'configured' || 'not configured' }}"
          echo "SSH key: ${{ secrets.DEPLOY_SSH_KEY != '' && 'configured' || 'not configured' }}"
          echo "Deployment path: ${{ secrets.DEPLOY_PATH != '' && 'configured' || 'not configured' }}"
          echo "Port: ${{ secrets.DEPLOY_PORT != '' && 'configured' || 'default 22' }}"

      - name: Validate required deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "CD is configured but deployment is intentionally blocked until the production secrets are added."
            exit 1
          fi

          echo "All required deployment secrets are configured."

      - name: Deployment placeholder
        run: |
          echo "Non-destructive CD configuration validated."
          echo "No remote commands are executed by this workflow yet."
          echo "Add the production deployment step only after the target server and rollback procedure are confirmed."
